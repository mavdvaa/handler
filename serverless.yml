service: sha-processor

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 60
  region: us-east-1
  environment:
    REDIS_URL: redis://localhost:6379

plugins:
  - serverless-offline

custom:
  serverless-offline:
    nodeWorkerThreads: true
    noPrependStageInUrl: true
    allowCache: true

functions:
  getTasks:
    handler: src/handler.getTasks # Путь: папка src -> файл handler -> функция getTasks
    events:
      - http:
          path: tasks
          method: get
          cors: true

  api:
    handler: src/handler.handler
    events:
      - http:
          path: sha
          method: post
          cors: true
      - http:
          path: triggered
          method: post
          cors: true
      - http:
          path: users
          method: post
          cors: true

  periodic:
    handler: src/periodicTasks.handler
    events:
      - schedule: rate(1 minute)
